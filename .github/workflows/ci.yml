name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify template variants are in sync
        run: node scripts/sync-templates.mjs --check

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pm: pnpm
            dir: template-pnpm
            install: pnpm install --frozen-lockfile
            typecheck: pnpm typecheck
            build: pnpm build
          - pm: npm
            dir: template-npm
            install: npm ci
            typecheck: npm run typecheck
            build: npm run build
          - pm: yarn
            dir: template-yarn
            install: yarn install --immutable
            typecheck: yarn typecheck
            build: yarn build
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: pnpm/action-setup@v4
        if: matrix.pm == 'pnpm'
        with:
          package_json_file: ${{ matrix.dir }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: ${{ matrix.install }}
      - name: Typecheck
        run: ${{ matrix.typecheck }}
      - name: Build
        run: ${{ matrix.build }}
